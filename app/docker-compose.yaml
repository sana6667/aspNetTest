version: '3.8'
services:
  web:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      # В контейнере переопределяем строку подключения: hostname базы — имя сервиса `db`
      ConnectionStrings__Default: "server=db;database=aspnetdb;user=root;password=root"

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
